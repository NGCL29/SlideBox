# Render Blueprint: deploys the SlideBox server (API + web app).
services:
  - type: web
    name: slidebox
    runtime: node
    plan: free
    buildCommand: echo "no build step"
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: INSTRUCTOR_CODE
        sync: false        # you choose this in the Render dashboard
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AUTH_SECRET
        generateValue: true
